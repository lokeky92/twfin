name: Daily Taiwan Capital Flow & ETF OpenAPI Sync & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'tests/**', 'argon_multi_agent/engine/**', 'argon_multi_agent/tests/**']
  schedule:
    # 每個交易日台灣時間約 16:43 (UTC 08:43) 與 20:17 (UTC 12:17) 抓取 TWSE / TPEx / MOPS 最新數據並更新網站。
    # 刻意避開整點與半點：GitHub 在 :00 / :30 最擁擠，實測 08:30 與 12:00 的排程會延遲 60~80 分鐘。
    # 這裡是「備援」：準時觸發由 Cloudflare Worker 的 cron 以 workflow_dispatch 負責 (見 cloudflare/README.md)，
    # 兩者都存在時，晚到的排程會由下方的 gate job 判斷資料剛更新過而略過。每次排程的實際延遲會寫進 step summary。
    - cron: '43 8 * * 1-5'
    - cron: '17 12 * * 1-5'

permissions:
  contents: write

# 避免兩次排程同時執行、互相覆蓋資料庫
concurrency:
  group: twfin-data-sync
  cancel-in-progress: false

env:
  # SQLite 資料庫不再提交進 git，改存放於這個 Release 的附件 (每次執行覆蓋)
  DB_RELEASE_TAG: data-latest
  DB_FILE: data/twfin_intelligence.db

jobs:
  # 排程閘門：晚到的備援排程若發現資料庫 90 分鐘內剛更新過就略過；手動 / Cloudflare 觸發 / push 一律不受影響
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this scheduled run is still needed
        id: gate
        run: python3 backend/sync_gate.py --min-gap-minutes 90

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit & API tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s argon_multi_agent/tests -v

  sync-and-update-db:
    needs: [test, gate]
    # push 只跑測試；排程與手動觸發才抓資料、部署；gate 判定資料剛更新過時略過
    if: github.event_name != 'push' && needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 首次遷移時需要從 git 歷史還原資料庫 (見下一步)
          fetch-depth: 50

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore SQLite database from release asset
        run: |
          mkdir -p data
          if gh release download "$DB_RELEASE_TAG" --pattern "$(basename "$DB_FILE")" --dir data --clobber; then
            echo "Restored database from release '$DB_RELEASE_TAG'."
          else
            # 首次執行：Release 尚不存在，從 git 歷史中最後一次提交的資料庫還原，保留模型版本與審計紀錄
            sha=$(git log -1 --format=%H --diff-filter=AM -- "$DB_FILE" || true)
            if [ -n "$sha" ] && git show "$sha:$DB_FILE" > "$DB_FILE"; then
              echo "Bootstrapped database from git history ($sha)."
            else
              rm -f "$DB_FILE"
              echo "No previous database found; pipeline will build a fresh one."
            fi
          fi

      - name: Run TWSE / TPEx / MOPS live pipeline & export dashboard
        run: python backend/run_pipeline.py --all

      - name: Upload SQLite database to release asset
        run: |
          if ! gh release view "$DB_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$DB_RELEASE_TAG" --title "Data snapshot (auto-updated)" \
              --notes "由排程自動更新的 SQLite 資料庫。請勿手動編輯此 Release。" --latest=false
          fi
          gh release upload "$DB_RELEASE_TAG" "$DB_FILE" --clobber

      - name: Upload single-file offline dashboard to release asset
        run: |
          # 拆分後 docs/index.html 無法直接雙擊離線開啟 (file:// 讀不到 data.json)；
          # 另外產生內嵌資料快照的單檔版，放在 Release 供下載
          python backend/export_standalone.py --single "$RUNNER_TEMP/twfin-standalone.html"
          gh release upload "$DB_RELEASE_TAG" "$RUNNER_TEMP/twfin-standalone.html" --clobber

      - name: Weekly database backup (keep latest 8)
        run: |
          # 每個 ISO 週只保留第一份快照，存放在獨立的 data-backups Release；損毀時可從這裡回溯
          tag=data-backups
          asset="twfin_$(date -u +%G-W%V).db"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Weekly database backups" \
              --notes "每週一份的 SQLite 資料庫備份，自動保留最近 8 份。" --latest=false
          fi
          if gh release view "$tag" --json assets -q '.assets[].name' | grep -qx "$asset"; then
            echo "Backup $asset already exists."
          else
            cp "$DB_FILE" "$RUNNER_TEMP/$asset"
            gh release upload "$tag" "$RUNNER_TEMP/$asset"
          fi
          gh release view "$tag" --json assets -q '.assets[].name' | sort -r | tail -n +9 | while read -r old; do
            gh release delete-asset "$tag" "$old" --yes
          done

      - name: Commit and push updated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 拆分部署：index.html (只有程式，改版才會變) 與 data.json (資料快照，每次排程更新)
          git add docs/index.html docs/data.json
          # 防護：pipeline 只應改動 docs/ 下這兩個檔案。若意外改到其他已追蹤檔案，發出警告並還原，避免 git pull 失敗
          others=$(git status --porcelain --untracked-files=no | grep -v -E ' docs/(index\.html|data\.json)$' || true)
          if [ -n "$others" ]; then
            echo "$others"
            echo "::warning title=Pipeline modified unexpected tracked files::$(echo "$others" | head -10 | tr '\n' ' ')"
            git restore --worktree -- .
          fi
          if git diff --staged --quiet; then
            echo "No website changes."
            exit 0
          fi
          git commit -m "chore(data): auto-sync TWSE/TPEx/MOPS live data & ETF scores"
          # 失敗時把 git 的錯誤訊息輸出成 annotation，未登入也能在 Actions 摘要看到原因
          run_git() {
            if ! out=$("$@" 2>&1); then
              echo "$out"
              echo "::error title=git $2 failed::$(echo "$out" | tail -5 | tr '\n' ' ')"
              exit 1
            fi
            echo "$out"
          }
          # main 在執行期間可能有新 commit (例如另一次排程)，推送失敗時重新 rebase 再試
          for attempt in 1 2 3; do
            run_git git pull --rebase origin main
            if git push origin HEAD:main 2>push.err; then exit 0; fi
            echo "::warning title=git push retry $attempt::$(tail -3 push.err | tr '\n' ' ')"
            sleep 5
          done
          echo "::error title=git push failed::$(tail -5 push.err | tr '\n' ' ')"
          exit 1
