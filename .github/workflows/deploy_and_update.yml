name: Daily Taiwan Capital Flow & ETF OpenAPI Sync & Deploy

on:
  workflow_dispatch:
  schedule:
    # 每個交易日台灣時間 16:30 (UTC 08:30) 與 20:00 (UTC 12:00) 自動在雲端抓取 TWSE / TPEx / MOPS 最新數據並更新資料庫與網站
    - cron: '30 8 * * 1-5'
    - cron: '0 12 * * 1-5'

permissions:
  contents: write

jobs:
  sync-and-update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run TWSE / TPEx / MOPS Live Pipeline & Update SQLite + HTML
        run: |
          python backend/run_pipeline.py
          python backend/export_standalone.py

      - name: Commit and Push updated SQLite Database & Website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/twfin_intelligence.db frontend/twfin_dashboard_standalone.html docs/index.html
          git diff --staged --quiet || (git commit -m "chore(data): auto-sync TWSE/TPEx/MOPS live data & ETF scores" && git push)
